name: CI
on:
  push:
  pull_request:
# Least privilege: the jobs only read the repository.
permissions:
  contents: read
jobs:
  test:
    runs-on: test-infra-2-undercurrent
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (the tag is in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fleet's /tmp is noexec; tests that write and run stand-in tools need a temp folder that allows execution.
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cd web/server && npm ci && npm run typecheck
      # Docker-backed tests skip on their own when no daemon answers; the parity harnesses need an upstream
      # checkout and are not run here. test/scrub.test.ts (personal data) runs as part of this.
      - run: pnpm test
        env:
          # The fleet runs jobs in containers; the tests exercise the host-side paths.
          HEADLONG_ASSUME_HOST: "1"
  secrets:
    runs-on: test-infra-2-undercurrent
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks over the whole history, from the release binary checked against its published SHA-256.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
